
name: ProjectX Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "Backend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "897722674193"
  ECR_REPO: projectx

jobs:
  build-and-deploy:
    name: Test, Build, and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: projectx_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d projectx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/projectx_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/projectx_test?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" |
            python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")

          python3 -c '
          import sys, json, base64
          p = sys.argv[1].split(".")[1]
          p += "=" * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          print(json.dumps({
              k: c.get(k)
              for k in ("sub", "aud", "iss", "repository", "ref")
          }, indent=2))
          ' "$TOKEN"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        working-directory: Backend
        run: npm ci

      - name: Prepare test database
        working-directory: Backend
        run: npx prisma db push

      - name: Run backend tests
        working-directory: Backend
        env:
          NODE_ENV: test
          RAZORPAY_KEY_ID: rzp_test_ci_dummy
          RAZORPAY_KEY_SECRET: ci_dummy_secret
          RAZORPAY_WEBHOOK_SECRET: ci_dummy_webhook_secret
        run: npm test -- --passWithNoTests

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::897722674193:role/github-deploy
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ProjectXGitHubDeploy

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        working-directory: Backend
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$ECR_REPO"
          docker build --pull -t "$IMAGE:$GITHUB_SHA" .

      - name: Push image to ECR
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          docker push "$REGISTRY/$ECR_REPO:$GITHUB_SHA"

      - name: Deploy to EC2 using SSM
        shell: bash
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE: ${{ steps.ecr.outputs.registry }}/projectx:${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$INSTANCE_ID" != "i-06654695856521b50" ]]; then
            echo "ERROR: EC2_INSTANCE_ID is missing or incorrect."
            exit 1
          fi

          COMMANDS=$(jq -n \
            --arg image "$IMAGE" \
            --arg region "$AWS_REGION" \
            --arg account "$AWS_ACCOUNT_ID" \
            '{
              commands: [
                "set -eu",
                "cd /opt/projectx",
                "test -f .env",
                "aws ecr get-login-password --region \($region) | docker login --username AWS --password-stdin \($account).dkr.ecr.\($region).amazonaws.com",
                "if grep -q \"^API_IMAGE=\" .env; then sed -i \"s|^API_IMAGE=.*|API_IMAGE=\($image)|\" .env; else printf \"\\nAPI_IMAGE=\($image)\\n\" >> .env; fi",
                "docker compose config -q",
                "docker compose pull api",
                "docker compose run --rm --no-deps api npx prisma migrate deploy",
                "docker compose up -d --no-deps api",
                "docker compose ps api"
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "ProjectX deployment $GITHUB_SHA" \
            --parameters "$COMMANDS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for attempt in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
                  --output json
                exit 0
                ;;
              Pending|InProgress|Delayed|"")
                echo "Deployment status: ${STATUS:-Pending}"
                sleep 5
                ;;
              *)
                echo "Deployment failed: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --output json || true
                exit 1
                ;;
            esac
          done

          echo "Timed out waiting for SSM."
          exit 1
